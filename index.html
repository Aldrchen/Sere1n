<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>个人主页</title>

<!-- ============================================================
  📝 文件说明
  ============================================================
  这是一个单文件个人主页，所有 HTML / CSS / JS 都在本文件内。
  零外部依赖，可直接部署到 GitHub Pages / Netlify / Vercel。

  📁 文件结构速览
  ├── <style>     → 全部样式（CSS 变量 / 背景 / 毛玻璃 / 布局 / 动画）
  ├── <body>      → 页面结构（背景层 / macOS 窗口 / 抽屉 / 时钟）
  └── <script>    → 全部逻辑（API 层 / 主题系统 / 时钟 / 火花 / 光圈）

  🎨 设计风格
  - 苹果液态玻璃（Liquid Glass）毛玻璃卡片
  - 水墨晕染动态背景（多 radial-gradient + blur）
  - 霓虹灯文字投影 + 卡片光圈效果
  - macOS 窗口外壳 + 可交互红黄绿按钮
  - SVG 图标系统（仿 SF Symbols）

  🔧 如何自定义（零基础指南）
  1. 改内容 → 找下方 CONFIG 对象（JS 区最前面）
  2. 改样式 → 找对应 CSS 区块（每个区块有中文标题分隔）
  3. 改结构 → 直接编辑 <body> 里的 HTML
  4. 接后端 → 替换 API.fetchProfile() 等函数为真实接口调用

  ⚠️ 注意事项
  - 不要删除 CSS 变量 :root 里的 --c1/--c2，主题系统依赖它们
  - JS 区标有 "【不要修改】" 的是框架代码，改 CONFIG 即可
  ============================================================ -->

<style>
/* ============================================================
   🎨 CSS 变量（全局调色板）
   ------------------------------------------------------------
   这些变量可以在 JS 中动态修改，实现主题色切换。
   --c1 / --c2 是主色和辅色，整站的渐变/发光都从这两个派生。
   ============================================================ */
:root {
  /* 主题色（会被 JS applyTheme() 动态覆盖） */
  --c1: #ff527c;                    /* 主色：霓虹粉 */
  --c2: #00ffff;                    /* 辅色：赛博青 */
  --c-accent: #ff449e;              /* 点缀色：荧光粉 */
  --c-glow: rgba(255,82,124,0.5);   /* 发光色：主色 + 50% 透明度 */

  /* 文字颜色层级（从亮到暗） */
  --text:       rgba(255,255,255,0.92);  /* 正文 */
  --text-soft:  rgba(255,255,255,0.65);  /* 次要文字 */
  --text-faint: rgba(255,255,255,0.38);  /* 辅助/禁用文字 */

  /* 视觉参数 */
  --blur: 28px;     /* 默认模糊强度 */
  --radius: 20px;   /* 卡片圆角 */

  /* 字体栈（优先用系统字体，不用下载） */
  --font: 'PingFang SC', 'HarmonyOS Sans', 'Microsoft YaHei', sans-serif;
  --mono: 'SF Mono', 'Consolas', monospace;  /* 等宽字体：用于时钟/代码 */
}

/* ============================================================
   🌍 全局重置 & 基础样式
   ------------------------------------------------------------
   * 是通配符，匹配所有元素。这里做浏览器默认样式清零。
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  min-height: 100vh;
  font-family: var(--font);
  color: var(--text);
  overflow-x: hidden;       /* 禁止横向滚动条 */
  position: relative;
  background: #0a0a18;      /* 兜底深色背景 */

  /* 禁止左键拖蓝选中文字（提升 app 感） */
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
}

/* 输入框/文本框例外：允许选中文字 */
input, textarea {
  -webkit-user-select: text;
  -moz-user-select: text;
  -ms-user-select: text;
  user-select: text;
}

/* 禁止图片被拖拽（防止误拖干扰体验） */
img { -webkit-user-drag: none; user-drag: none; }

/* 选中文字时的高亮色（粉色半透明） */
::selection { background: rgba(255,82,124,0.25); color: #fff; }

/* ============================================================
   🔤 文字 3D 浮雕投影（全局默认）
   ------------------------------------------------------------
   给所有文字加多层阴影，模拟浮雕深度。
   越重要的文字（h1）shadow 层数越多，越有立体感。
   ============================================================ */
body {
  text-shadow:
    0 1px 0 rgba(255,255,255,0.06),   /* 第1层：顶边高光 */
    0 1px 2px rgba(0,0,0,0.15);        /* 第2层：微投影 */
}

/* ============================================================
   🎯 SVG 图标系统（仿苹果 SF Symbols）
   ------------------------------------------------------------
   所有图标都是 inline SVG，统一通过 .icon 类控制样式。
   颜色自动继承父元素（currentColor），切换主题色时图标跟着变。
   ------------------------------------------------------------
   使用方法：
   <svg class="icon"><path d="..."/></svg>
   如果要渐变色：加 icon-grad 类
   ============================================================ */
.icon {
  width: 1em; height: 1em;       /* 跟随父元素字体大小 */
  flex-shrink: 0;
  vertical-align: middle;
  fill: none;                    /* SVG 不填充，只描边 */
  stroke: currentColor;           /* 颜色继承父元素 */
  stroke-width: 1.5;             /* 统一线宽 */
  stroke-linecap: round;          /* 圆角端点 */
  stroke-linejoin: round;         /* 圆角拐角 */
  transition: all 0.3s ease;
}
.icon-grad { stroke: url(#iconGrad); }  /* 使用渐变描边 */

/* 图标容器：毛玻璃底托（图标放在一个小圆角方块里） */
.icon-box {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
  border: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(8px);
  transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
}

/* 项目卡片图标（大号） */
.project-icon {
  width: 46px; height: 46px;
  font-size: 20px;               /* 控制 .icon 的 1em 大小 */
  color: var(--c2);              /* 辅色描边 */
  margin-bottom: 16px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.15);
}
.project-icon .icon {
  width: 22px; height: 22px;
  stroke: url(#iconGrad);        /* 渐变描边 */
  filter: drop-shadow(0 0 4px var(--c2));  /* 发光 */
}
.project:hover .project-icon {
  transform: scale(1.06);        /* 悬停放大 */
  border-color: rgba(0,255,255,0.15);
  box-shadow: 0 6px 20px rgba(0,255,255,0.06);
}

/* 生活碎片图标 */
.life-icon {
  width: 50px; height: 50px;
  font-size: 22px;
  color: var(--c1);
  margin: 0 auto 10px;
  display: flex;
}
.life-icon .icon {
  width: 24px; height: 24px;
  stroke: url(#iconGrad);
  filter: drop-shadow(0 0 3px var(--c1));
}
.life-item:hover .life-icon {
  transform: scale(1.08);
  color: var(--c2);
}
.life-item:hover .life-icon .icon {
  filter: drop-shadow(0 0 6px var(--c2));
}

/* 联系图标（GitHub/邮箱/微信等） */
.contact a {
  width: 46px; height: 46px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
  color: var(--text-soft); text-decoration: none;
  transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
}
.contact a .icon { width: 20px; height: 20px; stroke: currentColor; }
.contact a:hover {
  background: linear-gradient(135deg, rgba(255,82,124,0.12), rgba(0,255,255,0.06));
  color: var(--c2);
  border-color: rgba(0,255,255,0.15);
  box-shadow: 0 0 18px rgba(0,255,255,0.08);
  transform: translateY(-2px);    /* 上浮 */
}
.contact a:hover .icon {
  stroke: var(--c2);
  filter: drop-shadow(0 0 4px var(--c2));
}

/* 按钮内图标 */
.btn .icon { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.8; }
.btn-primary .icon { stroke: rgba(255,255,255,0.9); }

/* 信息列表图标（城市/职业/爱好等） */
.info-icon {
  width: 18px; height: 18px;
  stroke: var(--c1);
  margin-right: 10px;
  flex-shrink: 0;
  filter: drop-shadow(0 0 2px var(--c1));
}
.info-list li {
  display: flex; align-items: center;
  justify-content: flex-start;
  font-size: 13px;
  gap: 0;
}
.info-list .k { display: flex; align-items: center; color: var(--text-faint); min-width: 60px; }
.info-list .v { color: var(--text); font-weight: 500; }

/* 在线状态指示灯（绿色呼吸） */
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #4caf50;
  box-shadow: 0 0 8px #4caf50, 0 0 16px rgba(76,175,80,0.4);
  display: inline-block;
  margin-right: 6px;
  animation: statusPulse 2s ease-in-out infinite;  /* 呼吸动画 */
}
@keyframes statusPulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 8px #4caf50, 0 0 16px rgba(76,175,80,0.4); }
  50%      { opacity: 0.6; box-shadow: 0 0 4px #4caf50, 0 0 8px rgba(76,175,80,0.2); }
}

/* 抽屉按钮图标 + 标签图标 */
.drawer-trigger .icon { width: 22px; height: 22px; stroke: #fff; stroke-width: 1.5; }
.tag-icon { width: 10px; height: 10px; stroke: currentColor; margin-right: 4px; vertical-align: middle; }

/* ============================================================
   🖼️ 背景系统（5 层叠加）
   ------------------------------------------------------------
   z-index 从底到顶：
   -4  bg-base    纯黑底色
   -3  bg-ink     水墨晕染（主题色扩散）
   -1  bg-grain   噪点纹理（胶片质感）
    0  bg-glow    全局微光
    1  bg-cursor  鼠标光圈（在 mac-window 内部）
    2  mac-window 主内容窗口
   ============================================================ */

/* 第1层：纯黑底 */
.bg-base { position: fixed; inset: 0; z-index: -4; background: #080812; }

/* 第2层：水墨晕染（4个径向渐变叠加 + 大模糊 = 墨滴入水效果） */
.bg-ink {
  position: fixed; inset: -10%; z-index: -3;
  background:
    radial-gradient(ellipse 45% 55% at 20% 30%, var(--c1) 0%, transparent 60%),
    radial-gradient(ellipse 40% 50% at 80% 70%, var(--c2) 0%, transparent 55%),
    radial-gradient(ellipse 30% 35% at 60% 20%, var(--c-accent) 0%, transparent 50%),
    radial-gradient(ellipse 60% 60% at 50% 50%, rgba(20,20,60,0.4) 0%, transparent 70%);
  filter: blur(60px);          /* 关键：大模糊让色块融在一起 */
  opacity: 0.55;
  transition: background 1.2s ease;  /* 切换主题时平滑过渡 */
}

/* 第3层：鼠标光圈（双层白色 + 主题色光点） */
.bg-cursor {
  position: absolute; inset: 0; z-index: 0;
  pointer-events: none;
  border-radius: inherit;
  opacity: 0;                  /* JS 控制显隐 */
  transition: opacity 0.2s ease;
  background:
    radial-gradient(circle 60px at var(--mx, 50%) var(--my, 50%),
      rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.18) 40%,
      rgba(255,255,255,0.06) 70%, transparent 100%),
    radial-gradient(circle 120px at var(--mx, 50%) var(--my, 50%),
      rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.04) 50%, transparent 80%);
  mix-blend-mode: screen;       /* 叠加模式：越叠越亮 */
}
.bg-cursor-glow {
  position: absolute; inset: 0; z-index: 0;
  pointer-events: none;
  border-radius: inherit;
  opacity: 0;
  transition: opacity 0.2s ease;
  background: radial-gradient(circle 45px at var(--mx, 50%) var(--my, 50%), var(--c1) 0%, transparent 70%);
  mix-blend-mode: screen;
}

/* 确保内容在光源之上 */
.mac-content { position: relative; z-index: 1; }
.mac-titlebar { position: relative; z-index: 2; }

/* 第4层：全局光晕 */
.bg-glow {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(circle 50% at 50% 50%, rgba(255,255,255,0.04) 0%, transparent 65%);
}

/* 第5层：噪点纹理（SVG 分形噪声，模拟胶片颗粒） */
.bg-grain {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  opacity: 0.2;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
  background-size: 128px 128px;
  mix-blend-mode: overlay;
}

/* 点击火花画布（全屏覆盖，用于粒子渲染） */
#sparkCanvas { position: fixed; inset: 0; z-index: 9999; pointer-events: none; }

/* ============================================================
   🖥️ macOS 窗口外壳
   ------------------------------------------------------------
   整个页面套在一个模拟 macOS 窗口的容器里。
   顶部标题栏 + 红黄绿三按钮 + 内容区。
   ============================================================ */
.mac-window {
  max-width: 1500px;
  margin: 20px auto;            /* 居中 + 顶部留白 */
  border-radius: 14px;
  overflow: hidden;
  /* 苹果液态玻璃效果 */
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(50px) saturate(200%) brightness(110%);
  -webkit-backdrop-filter: blur(50px) saturate(200%) brightness(110%);
  border: 1px solid rgba(255,255,255,0.18);
  border-top-color: rgba(255,255,255,0.28);   /* 顶部更亮 = 光源在上 */
  border-left-color: rgba(255,255,255,0.22);   /* 左侧微亮 = 侧光 */
  box-shadow:
    0 24px 80px rgba(0,0,0,0.35),              /* 外阴影（深度） */
    inset 0 1px 0 rgba(255,255,255,0.20),       /* 内顶高光 */
    inset 0 -1px 0 rgba(255,255,255,0.05),      /* 内底暗线 */
    inset 1px 0 0 rgba(255,255,255,0.10),       /* 内左高光 */
    0 0 60px rgba(255,255,255,0.03);            /* 外层微光 */
  position: relative;
  z-index: 10;
}
/* 顶部 1px 反光条 */
.mac-window::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  z-index: 1;
}

/* 标题栏 */
.mac-titlebar {
  height: 38px;
  display: flex; align-items: center;
  padding: 0 14px;
  background: rgba(255,255,255,0.04);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  user-select: none;
  -webkit-app-region: drag;     /* Electron 风格可拖动 */
}
/* 红黄绿三按钮 */
.mac-btns { display: flex; gap: 8px; -webkit-app-region: no-drag; }
.mac-btn {
  width: 13px; height: 13px;
  border-radius: 50%;
  border: none; cursor: pointer;
  position: relative;
  transition: filter 0.2s, transform 0.15s;
  outline: none;
}
.mac-btn:hover { filter: brightness(1.15); }
.mac-btn:active { transform: scale(0.88); }  /* 按下缩小 */
.mac-btn.close    { background: #ff5f57; }
.mac-btn.minimize { background: #ffbd2e; }
.mac-btn.maximize { background: #28c840; }
/* 悬停显示 × − + 符号 */
.mac-btn::after {
  content: ''; position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 8px; font-weight: 700; color: rgba(0,0,0,0.55);
  opacity: 0; transition: opacity 0.15s;
}
.mac-btn.close::after    { content: '×'; }
.mac-btn.minimize::after { content: '−'; }
.mac-btn.maximize::after { content: '+'; }
.mac-btn:hover::after { opacity: 1; }

/* 标题文字 */
.mac-title { font-size: 13px; color: var(--text-soft); letter-spacing: 1px; text-align: center; flex: 1; padding-right: 50px; }

/* 输入框保留文本光标 */
input[type="text"], input[type="email"], textarea { cursor: text; }

/* ============================================================
   🧊 毛玻璃卡片（.glass）
   ------------------------------------------------------------
   所有内容卡片的统一基类。
   - 半透明白色背景 + backdrop-filter 模糊
   - 多层 box-shadow 模拟厚度
   - ::before 做内部渐变高光
   - ::after 做顶部细高光线
   ============================================================ */
.glass {
  background: rgba(255,255,255,0.07);
  backdrop-filter: blur(30px) saturate(180%) brightness(108%);
  -webkit-backdrop-filter: blur(30px) saturate(180%) brightness(108%);
  border: 1px solid rgba(255,255,255,0.14);
  border-top-color: rgba(255,255,255,0.22);
  border-left-color: rgba(255,255,255,0.18);
  border-radius: var(--radius);
  box-shadow:
    0 8px 32px rgba(0,0,0,0.20),
    inset 0 1px 0 rgba(255,255,255,0.16),
    inset 0 -1px 0 rgba(255,255,255,0.04),
    inset 1px 0 0 rgba(255,255,255,0.08);
  position: relative;
  overflow: hidden;
  cursor: default;
  transition: transform 0.4s cubic-bezier(0.4,0,0.2,1), box-shadow 0.4s ease, border-color 0.4s ease;
}
/* 内部 135° 渐变高光（模拟玻璃折射） */
.glass::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg,
    rgba(255,255,255,0.08) 0%,
    rgba(255,255,255,0.02) 30%,
    transparent 50%,
    rgba(255,255,255,0.01) 70%,
    rgba(255,255,255,0.04) 100%
  );
  pointer-events: none;
  border-radius: inherit;
}

/* ============================================================
   ✨ 光圈效果（替代按压下沉）
   ------------------------------------------------------------
   鼠标悬停时：边框提亮 + 三层光晕扩散
   不位移、不缩放 → 像光打在玻璃边缘
   ============================================================ */
.glass:hover {
  border-color: rgba(255,255,255,0.18);
  box-shadow:
    0 8px 32px rgba(0,0,0,0.22),
    0 0 0 1px rgba(255,255,255,0.10),              /* 外层白边 */
    0 0 24px rgba(255,82,124,0.06),                 /* 主题色光晕 */
    inset 0 1px 0 rgba(255,255,255,0.10);
}
/* 顶部高光线 */
.glass::after {
  content: '';
  position: absolute; top: 0; left: 8%; right: 8%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
  pointer-events: none;
}

/* ============================================================
   📐 页面布局（CSS Grid 横版）
   ------------------------------------------------------------
   左侧 340px 固定（头像/信息/技能）
   右侧 1fr 自适应（hero/项目/生活/联系）
   ============================================================ */
.layout {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 24px;
  padding: 24px;
  max-width: 1400px;
  margin: 0 auto;
}

/* ========== 左侧栏 ========== */
.sidebar { display: flex; flex-direction: column; gap: 20px; }
/* sticky 让左侧在右侧滚动时保持可见 */
.sidebar-sticky { position: sticky; top: 24px; display: flex; flex-direction: column; gap: 20px; }

/* ---- 头像卡片 ---- */
.card-profile { padding: 36px 28px 30px; text-align: center; }

/* 头像容器 */
.avatar-wrap {
  position: relative;
  width: 96px; height: 96px;
  margin: 0 auto 18px;
  cursor: pointer;
  transition: transform 0.8s cubic-bezier(0.4,0,0.2,1);
}
/* 唱片旋转（悬停时加速 + 放大） */
.avatar-wrap:hover { transform: rotate(360deg) scale(1.08); }
/* 头像光环（conic-gradient 旋转动画） */
.avatar-ring {
  position: absolute; inset: -4px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, var(--c1), var(--c2), var(--c-accent), var(--c1));
  animation: ringSpin 12s linear infinite;
  filter: blur(3px);
  opacity: 0.8;
  transition: filter 0.3s, opacity 0.3s;
}
.avatar-wrap:hover .avatar-ring { animation-duration: 2s; filter: blur(4px); opacity: 1; }
@keyframes ringSpin { to { transform: rotate(360deg); } }
/* 头像本体 */
.avatar {
  position: absolute; inset: 4px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03));
  border: 2px solid rgba(255,255,255,0.15);
  display: flex; align-items: center; justify-content: center;

  position: fixed; left: 24px; bottom: 24px; z-index: 2147483647;

   🔧 脚本区
   ------------------------------------------------------------
   分四大模块：
   1. API 层    → 数据获取接口（预留后端对接）
   2. CONFIG    → 前端配置（你改这里）
   3. 主题系统  → 颜色切换
   4. 特效系统  → 时钟 / 火花 / 光圈 / macOS 按钮
   ============================================================ -->
<script>
"use strict";

/* ============================================================
   📡 1. API 数据层（为后端管理端预留接口）
   ------------------------------------------------------------
   设计思路：
   - 当前用 localStorage 模拟数据持久化
   - 后续接后端时，只需修改 fetchProfile / saveProfile 等函数
   - 后端返回格式约定为 JSON，字段见下方接口文档

   🔗 接口约定（RESTful）
   ------------------------------------------------------------
   GET    /api/profile       → 获取个人资料
   PUT    /api/profile       → 更新个人资料
   GET    /api/projects      → 获取项目列表
   POST   /api/projects      → 新增项目
   DELETE /api/projects/:id  → 删除项目
   GET    /api/skills        → 获取技能列表
   PUT    /api/skills        → 更新技能
   GET    /api/life          → 获取生活碎片
   GET    /api/social        → 获取社交链接
   GET    /api/theme         → 获取当前主题
   PUT    /api/theme         → 设置主题

   📦 响应格式（统一）
   { "code": 200, "msg": "ok", "data": { ... } }
   code: 200 成功 / 401 未登录 / 403 无权限 / 500 服务器错误
   ------------------------------------------------------------

   使用方式（三选一）：
   A. 纯前端：直接用 CONFIG 对象（默认）
   B. 本地存储：调用 API.useLocal()  → 数据存 localStorage
   C. 远程后端：调用 API.useRemote('https://your-domain.com')
                然后 API.fetchProfile().then(data => ...)
   ============================================================ */
const API = {
  /* ---------- 配置 ---------- */
  mode: 'config',              // 'config' | 'local' | 'remote'
  baseURL: '',                  // 远程后端地址
  token: '',                    // JWT token（登录后设置）

  /* ---------- 模式切换 ---------- */
  useConfig() { this.mode = 'config'; },
  useLocal()  { this.mode = 'local'; this._initLocal(); },
  useRemote(baseURL, token) { this.mode = 'remote'; this.baseURL = baseURL.replace(/\/$/, ''); this.token = token || ''; },

  /* ---------- localStorage 初始化 ---------- */
  _initLocal() {
    if (!localStorage.getItem('profile')) {
      localStorage.setItem('profile', JSON.stringify(CONFIG));
    }
  },

  /* ---------- 通用请求封装（远程模式用） ---------- */
  async _request(path, options = {}) {
    const url = this.baseURL + path;
    const headers = { 'Content-Type': 'application/json', ...options.headers };
    if (this.token) headers['Authorization'] = 'Bearer ' + this.token;
    const res = await fetch(url, { ...options, headers });
    if (!res.ok) throw new Error('API Error: ' + res.status);
    return res.json();  // { code, msg, data }
  },

  /* ---------- 个人资料 ---------- */
  async fetchProfile() {
    if (this.mode === 'remote') return this._request('/api/profile');
    if (this.mode === 'local')  return JSON.parse(localStorage.getItem('profile') || '{}');
    return CONFIG;  // config 模式：直接返回 CONFIG
  },
  async saveProfile(data) {
    if (this.mode === 'remote') return this._request('/api/profile', { method: 'PUT', body: JSON.stringify(data) });
    if (this.mode === 'local')  localStorage.setItem('profile', JSON.stringify(data));
    Object.assign(CONFIG, data);  // config 模式：同步到内存
    return { code: 200, msg: 'ok' };
  },

  /* ---------- 项目列表 ---------- */
  async fetchProjects() {
    if (this.mode === 'remote') return this._request('/api/projects');
    if (this.mode === 'local')  return JSON.parse(localStorage.getItem('projects') || '[]');
    return CONFIG.projects || [];
  },
  async saveProject(project) {
    if (this.mode === 'remote') return this._request('/api/projects', { method: 'POST', body: JSON.stringify(project) });
    const list = JSON.parse(localStorage.getItem('projects') || '[]');
    list.push(project);
    localStorage.setItem('projects', JSON.stringify(list));
    return { code: 200, msg: 'ok' };
  },

  /* ---------- 技能列表 ---------- */
  async fetchSkills() {
    if (this.mode === 'remote') return this._request('/api/skills');
    if (this.mode === 'local')  return JSON.parse(localStorage.getItem('skills') || '[]');
    return CONFIG.skills || [];
  },
  async saveSkills(skills) {
    if (this.mode === 'remote') return this._request('/api/skills', { method: 'PUT', body: JSON.stringify(skills) });
    localStorage.setItem('skills', JSON.stringify(skills));
    CONFIG.skills = skills;
    return { code: 200, msg: 'ok' };
  },

  /* ---------- 生活碎片 ---------- */
  async fetchLife() {
    if (this.mode === 'remote') return this._request('/api/life');
    if (this.mode === 'local')  return JSON.parse(localStorage.getItem('life') || '[]');
    return CONFIG.life || [];
  },

  /* ---------- 社交链接 ---------- */
  async fetchSocial() {
    if (this.mode === 'remote') return this._request('/api/social');
    if (this.mode === 'local')  return JSON.parse(localStorage.getItem('social') || '{}');
    return CONFIG.social || {};
  },

  /* ---------- 主题 ---------- */
  async fetchTheme() {
    if (this.mode === 'remote') return this._request('/api/theme');
    return localStorage.getItem('theme') || 'neon';
  },
  async saveTheme(key) {
    if (this.mode === 'remote') return this._request('/api/theme', { method: 'PUT', body: JSON.stringify({ key }) });
    localStorage.setItem('theme', key);
    return { code: 200, msg: 'ok' };
  },
};

/* 应用主题：修改 CSS 变量 + 背景渐变 + 头像光环 */
function applyTheme(key) {
  const t = THEMES[key];
  if (!t) return;
  currentTheme = key;

  const root = document.documentElement;
  root.style.setProperty('--c1', t.c1);
  root.style.setProperty('--c2', t.c2);
  root.style.setProperty('--c-accent', t.accent);
  root.style.setProperty('--c-glow', t.c1 + '80');  // 80 = 50% hex alpha

  /* 头像光环渐变 */
  document.querySelector('.avatar-ring').style.background =
    `conic-gradient(from 0deg, ${t.c1}, ${t.c2}, ${t.accent}, ${t.c1})`;

  /* 水墨背景 4 色扩散 */
  $('bgInk').style.background = `
    radial-gradient(ellipse 45% 55% at 20% 30%, ${t.c1} 0%, transparent 60%),
    radial-gradient(ellipse 40% 50% at 80% 70%, ${t.c2} 0%, transparent 55%),
    radial-gradient(ellipse 30% 35% at 60% 20%, ${t.accent} 0%, transparent 50%),
    radial-gradient(ellipse 60% 60% at 50% 50%, rgba(20,20,60,0.4) 0%, transparent 70%)
  `;

  /* 持久化 */
  API.saveTheme(key);
}

/* 抽屉渲染 */
function renderThemeList() {
  const list = $('themeList');
  list.innerHTML = '';
  Object.keys(THEMES).forEach((key, idx) => {
    const t = THEMES[key];
    const div = document.createElement('div');
    div.className = 'theme-option' + (key === currentTheme ? ' active' : '');
    div.innerHTML = `
      <div class="theme-num">${idx + 1}</div>
      <div><div class="theme-name">${t.name}</div><div class="theme-desc">${t.desc}</div></div>
    `;
    div.onclick = () => {
      applyTheme(key);
      document.querySelectorAll('.theme-option').forEach(o => o.classList.remove('active'));
      div.classList.add('active');
    };
    list.appendChild(div);
  });
}

/* ============================================================
   🖱️ 4. macOS 窗口按钮行为
   ------------------------------------------------------------
   close:    窗口缩小淡出后弹回（模拟关闭再打开）
   minimize: 窗口缩到左下角半透明后弹回
   maximize: 切换全屏 / 还原
   ============================================================ */
let isMaximized = false;
let savedRect = null;

function macBtnAction(action) {
  const win = $('main-page');
  if (action === 'close') {
    win.style.transition = 'all 0.4s cubic-bezier(0.4,0,0.2,1)';
    win.style.transform = 'scale(0.85)';
    win.style.opacity = '0.3';
    setTimeout(() => { win.style.transform = ''; win.style.opacity = ''; }, 600);
  } else if (action === 'minimize') {
    win.style.transition = 'all 0.4s cubic-bezier(0.4,0,0.2,1)';
    win.style.transform = 'scale(0.6) translate(-20%, 20%)';
    win.style.opacity = '0.5';
    setTimeout(() => { win.style.transform = ''; win.style.opacity = ''; }, 600);
  } else if (action === 'maximize') {
    if (!isMaximized) {
      savedRect = { margin: win.style.margin, borderRadius: win.style.borderRadius, maxWidth: win.style.maxWidth };
      win.style.transition = 'all 0.4s cubic-bezier(0.4,0,0.2,1)';
      win.style.margin = '0';
      win.style.borderRadius = '0';
      win.style.maxWidth = '100%';
      isMaximized = true;
    } else {
      win.style.margin = savedRect.margin || '';
      win.style.borderRadius = savedRect.borderRadius || '';
      win.style.maxWidth = savedRect.maxWidth || '';
      isMaximized = false;
    }
  }
}

/* 农历计算函数 */
function lYearDays(y){let s=348;for(let i=0x8000;i>0x8;i>>=1)s+=(lunarInfo[y-1900]&i)?1:0;return s+leapDays(y)}
function leapMonth(y){return lunarInfo[y-1900]&0xf}
function leapDays(y){return leapMonth(y)?(lunarInfo[y-1900]&0x10000?30:29):0}
function monthDays(y,m){return(lunarInfo[y-1900]&(0x10000>>m))?30:29}

function solarToLunar(yy,mm,dd){
  let y=1900,m=1,d=1;
  let offset=Math.floor((Date.UTC(yy,mm-1,dd)-Date.UTC(1900,0,31))/86400000);
  let temp=0;
  for(y=1900;y<2101&&offset>0;y++){temp=lYearDays(y);offset-=temp}
  if(offset<0){offset+=temp;y--}
  let leap=leapMonth(y);let isLeap=false;
  for(m=1;m<13&&offset>0;m++){
    if(leap>0&&m===(leap+1)&&!isLeap){--m;isLeap=true;temp=leapDays(y)}else{temp=monthDays(y,m)}
    if(isLeap&&m===(leap+1))isLeap=false;offset-=temp;
  }
  if(offset===0&&leap>0&&m===leap+1)if(!isLeap){isLeap=true;--m}
  if(offset<0){offset+=temp;m--}
  d=offset+1;return{year:y,month:m,day:d,isLeap:isLeap};
}

function getLunarStr(y,m,d){const l=solarToLunar(y,m,d);return lunarMonthName[l.month-1]+'月'+lunarDayName[l.day-1]}
function getGZYear(y){return Gan[(y-4)%10]+Zhi[(y-4)%12]+'年('+Animals[(y-4)%12]+')'}

/* 更新时钟 DOM */
function updateClock(){
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const ss = String(now.getSeconds()).padStart(2,'0');
  const Y = now.getFullYear(), M = now.getMonth()+1, D = now.getDate();
  $('clockTime').textContent  = `${hh}:${mm}:${ss}`;
  $('clockDate').textContent  = `${Y}年${M}月${D}日 ${weekNames[now.getDay()]} ${getGZYear(Y)}`;
  $('clockLunar').textContent = `农历 ${getLunarStr(Y,M,D)}`;
}
updateClock();
setInterval(updateClock, 1000);

/* --- 生成圆形进度条 --- */
function renderSkills(skills) {
  const list = $('skillList');
  list.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'skills-grid';
  const C = 226.2;  // 圆周长 2π × 36

  skills.forEach((s, i) => {
    const offset = C * (1 - s.pct / 100);
    const delay = 200 + i * 150;
    const item = document.createElement('div');
    item.className = 'skill-item';
    item.innerHTML = `
      <div class="skill-circle">
        <svg width="72" height="72" viewBox="0 0 80 80">
          <circle class="track" cx="40" cy="40" r="36"/>
          <circle class="progress" cx="40" cy="40" r="36" style="stroke-dashoffset:226"/>
        </svg>
        <div class="pct-text">${s.pct}%</div>
      </div>
      <div class="skill-name">${s.name}</div>
    `;
    grid.appendChild(item);
    /* 延迟触发动画 */
    setTimeout(() => {
      item.querySelector('.progress').style.strokeDashoffset = offset.toFixed(1);
    }, delay);
  });
  list.appendChild(grid);
}

/* ============================================================
   💥 7. 点击火花特效
   ------------------------------------------------------------
   Canvas 粒子系统，每次点击爆出白色粒子。
   物理模拟：初速度 + 重力 + 空气阻力 + 透明度衰减。
   ============================================================ */
const sparkCanvas = $('sparkCanvas');
const ctx = sparkCanvas.getContext('2d');
let sparks = [];

/* Canvas 尺寸跟随窗口 */
function resizeCanvas() { sparkCanvas.width = window.innerWidth; sparkCanvas.height = window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

/* 创建一次火花爆发 */
function createSparks(x, y) {
  const count = 16 + Math.random() * 8;  /* 16~24 个粒子 */
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 4;
    sparks.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 0.8,
      life: 30 + Math.random() * 20,
      maxLife: 50,
      size: 1.5 + Math.random() * 2,
      gravity: 0.08,
      friction: 0.95,
    });
  }
  /* 中心白光 */
  sparks.push({ x, y, vx: 0, vy: 0, life: 10, maxLife: 10, size: 5 + Math.random() * 3, isFlash: true });
}

/* 渲染循环（requestAnimationFrame 驱动） */
function renderSparks() {
  ctx.clearRect(0, 0, sparkCanvas.width, sparkCanvas.height);
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.x  += s.vx;
    s.y  += s.vy;
    s.vy += s.gravity;
    s.vx *= s.friction;
    s.vy *= s.friction;
    s.life--;
    const a = s.life / s.maxLife;
    if (a <= 0) { sparks.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size * a, 0, Math.PI * 2);
    if (s.isFlash) {
      ctx.fillStyle = `rgba(255,255,255,${a * 0.7})`;
      ctx.shadowBlur = 12; ctx.shadowColor = '#fff';
    } else {
      ctx.fillStyle = `rgba(255,255,255,${a * 0.9})`;
      ctx.shadowBlur = 6;  ctx.shadowColor = '#fff';
    }
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  requestAnimationFrame(renderSparks);
}
requestAnimationFrame(renderSparks);

/* 点击触发 */
document.addEventListener('click', e => { createSparks(e.clientX, e.clientY); });

/* ============================================================
   🖱️ 8. 鼠标光圈（仅在 mac-window 内部）
   ------------------------------------------------------------
   计算鼠标在窗口内的相对坐标，更新光圈位置。
   鼠标在窗口外时隐藏光圈。
   ============================================================ */
const cursorLayer = $('bgCursor');
const cursorGlow  = $('bgCursorGlow');
const macWindow   = $('main-page');

document.addEventListener('mousemove', e => {
  if (!macWindow || !cursorLayer) return;
  const rect = macWindow.getBoundingClientRect();
  const lx = e.clientX - rect.left;
  const ly = e.clientY - rect.top;
  const inside = lx >= 0 && lx <= rect.width && ly >= 0 && ly <= rect.height;

  if (inside) {
    cursorLayer.style.opacity = '1';
    cursorGlow.style.opacity  = '0.12';
    const x = (lx / rect.width  * 100).toFixed(1) + '%';
    const y = (ly / rect.height * 100).toFixed(1) + '%';
    /* 双层白色光圈 */
    cursorLayer.style.background =
      'radial-gradient(circle 60px at ' + x + ' ' + y + ',' +
      ' rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.18) 40%,' +
      ' rgba(255,255,255,0.06) 70%, transparent 100%),' +
      'radial-gradient(circle 120px at ' + x + ' ' + y + ',' +
      ' rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.04) 50%, transparent 80%)';
    /* 主题色光点 */
    cursorGlow.style.background =
      'radial-gradient(circle 45px at ' + x + ' ' + y + ', var(--c1) 0%, transparent 70%)';
  } else {
    cursorLayer.style.opacity = '0';
    cursorGlow.style.opacity  = '0';
  }
});

/* ============================================================
   🚀 9. 初始化流程
   ------------------------------------------------------------
   页面加载后：
   1. 尝试从后端 API 拉取全部数据（/api/all）
   2. 成功 → 用后端数据渲染，CONFIG 作为兜底默认值
   3. 失败 → 降级使用 CONFIG 对象（离线/纯静态部署）
   4. 应用主题 → 启动时钟 → 启动火花
   ============================================================ */
async function initPage() {
  try {
    // 尝试从后端拉取（如果后端不存在，fetch 会抛错进入 catch）
    const res = await fetch('/api/all');
    if (res.ok) {
      const json = await res.json();
      if (json.code === 200 && json.data) {
        const d = json.data;
        // 用后端数据覆盖 CONFIG
        if (d.profile) {
          Object.assign(CONFIG, d.profile);
          // avatarUrl 可能是相对路径，补全为绝对路径
          if (CONFIG.avatarUrl && CONFIG.avatarUrl.startsWith('/uploads/')) {
            // 同源情况下直接使用
          }
        }
        if (d.skills)  CONFIG.skills  = d.skills;
        if (d.projects) CONFIG.projects = d.projects;
        if (d.life)    CONFIG.life    = d.life;
        if (d.social)  CONFIG.social  = d.social;
        if (d.theme)   currentTheme   = d.theme;
        console.log('[init] 数据来源: 后端 API');
      }
    }
  } catch (e) {
    console.log('[init] 数据来源: 本地 CONFIG（后端不可用）');
  }

  // 统一渲染
  renderProfile(CONFIG);
  renderSkills(CONFIG.skills);
  renderProjects(CONFIG.projects);
  renderLife(CONFIG.life);
  renderThemeList();
  applyTheme(currentTheme);
}
initPage();

/* 主题也优先从后端读 */
API.fetchTheme().then(key => {
  if (typeof key === 'object' && key.data) key = key.data;
  if (key && THEMES[key]) { currentTheme = key; applyTheme(key); }
});
