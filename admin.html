<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>管理后台 - 个人主页</title>
<style>
:root { --c1:#ff527c; --c2:#00ffff; --accent:#ff449e; --bg:#0a0a14; --text:#e8e8f0; --soft:rgba(232,232,240,0.6); --faint:rgba(232,232,240,0.35); --border:rgba(255,255,255,0.08); }
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
a { color:inherit; text-decoration:none; }
.glass { background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:14px; padding:24px; backdrop-filter:blur(20px); }
.btn { display:inline-flex; align-items:center; gap:6px; padding:10px 20px; border-radius:10px; border:1px solid var(--border); background:rgba(255,255,255,0.04); color:var(--text); cursor:pointer; font-size:13px; font-weight:600; transition:all .3s; }
.btn:hover { background:rgba(255,255,255,0.08); border-color:var(--c1); box-shadow:0 0 16px rgba(255,82,124,0.15); }
.btn-primary { background:linear-gradient(135deg,var(--c1),var(--accent)); border-color:transparent; color:#fff; }
.btn-primary:hover { box-shadow:0 4px 20px rgba(255,82,124,0.3); }
.btn-danger { background:rgba(255,59,48,0.1); border-color:rgba(255,59,48,0.2); color:#ff6b6b; }
.form-group { margin-bottom:16px; }
.form-label { display:block; font-size:12px; font-weight:600; color:var(--soft); margin-bottom:6px; }
.form-input { width:100%; padding:10px 14px; border-radius:8px; border:1px solid var(--border); background:rgba(255,255,255,0.04); color:var(--text); font-size:14px; outline:none; transition:border .3s; }
.form-input:focus { border-color:var(--c1); box-shadow:0 0 0 3px rgba(255,82,124,0.1); }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.section-title { font-size:15px; font-weight:700; margin-bottom:16px; color:var(--text); }
.toast { position:fixed; top:20px; right:20px; padding:12px 20px; border-radius:10px; font-size:13px; z-index:9999; animation:slideIn .3s; }
.toast-success { background:rgba(48,209,88,0.15); border:1px solid rgba(48,209,88,0.3); color:#4cd964; }
.toast-error { background:rgba(255,59,48,0.15); border:1px solid rgba(255,59,48,0.3); color:#ff6b6b; }
@keyframes slideIn { from{transform:translateX(100%);opacity:0;} to{transform:translateX(0);opacity:1;} }
</style>
</head>
<body>

<div style="max-width:720px;margin:40px auto;padding:0 20px;" id="app">

  <!-- 登录页 -->
  <div id="loginPage" class="glass" style="text-align:center;padding:48px 24px;">
    <h1 style="font-size:24px;margin-bottom:8px;">🔐 管理后台登录</h1>
    <p style="color:var(--soft);font-size:13px;margin-bottom:32px;">使用 GitHub Token 登录，管理你的主页数据</p>
    <div class="form-group" style="text-align:left;">
      <label class="form-label">GitHub 用户名</label>
      <input class="form-input" id="f_user" placeholder="你的 GitHub 用户名">
    </div>
    <div class="form-group" style="text-align:left;">
      <label class="form-label">GitHub Personal Access Token</label>
      <input class="form-input" id="f_token" type="password" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
    </div>
    <div class="form-group" style="text-align:left;">
      <label class="form-label">仓库名（含组织）</label>
      <input class="form-input" id="f_repo" placeholder="aldrchen/Sere1n">
    </div>
    <div class="form-group" style="text-align:left;">
      <label class="form-label">数据文件路径</label>
      <input class="form-input" id="f_path" value="data.json">
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;padding:14px;" onclick="doLogin()">登录</button>
    <p style="font-size:11px;color:var(--faint);margin-top:20px;line-height:1.8;">
      💡 Token 需要 <code style="color:var(--c1)">repo</code> 权限（读写仓库）<br>
      创建地址：GitHub → Settings → Developer settings → Personal access tokens
    </p>
  </div>

  <!-- 管理页 -->
  <div id="adminPage" style="display:none;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
      <h1 style="font-size:20px;">⚙️ 管理后台</h1>
      <button class="btn btn-danger" onclick="doLogout()">退出</button>
    </div>

    <!-- 个人资料 -->
    <div class="glass" style="margin-bottom:20px;">
      <div class="section-title">👤 个人资料</div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">姓名</label><input class="form-input" id="p_name"></div>
        <div class="form-group"><label class="form-label">方向/头衔</label><input class="form-input" id="p_title"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">城市</label><input class="form-input" id="p_city"></div>
        <div class="form-group"><label class="form-label">职业</label><input class="form-input" id="p_job"></div>
      </div>
      <div class="form-group"><label class="form-label">爱好</label><input class="form-input" id="p_hobby"></div>
      <div class="form-group"><label class="form-label">头像文字（无图片时显示）</label><input class="form-input" id="p_avatarText" maxlength="3" style="width:100px;text-align:center;font-size:18px;font-weight:700;"></div>
      <div class="form-group"><label class="form-label">头像图片 URL</label><input class="form-input" id="p_avatarUrl" placeholder="https://... 或留空用文字"></div>
      <div class="form-group"><label class="form-label">简介（支持 &lt;br&gt; 换行）</label><textarea class="form-input" id="p_bio" rows="3"></textarea></div>
      <div style="margin-top:8px;"><button class="btn btn-primary" onclick="saveProfile()">💾 保存资料</button></div>
    </div>

    <!-- Hero -->
    <div class="glass" style="margin-bottom:20px;">
      <div class="section-title">🦸 欢迎区</div>
      <div class="form-group"><label class="form-label">问候语</label><input class="form-input" id="h_greeting"></div>
      <div class="form-group"><label class="form-label">名字（高亮显示）</label><input class="form-input" id="h_name"></div>
      <div class="form-group"><label class="form-label">描述文字</label><textarea class="form-input" id="h_desc" rows="3"></textarea></div>
      <div style="margin-top:8px;"><button class="btn btn-primary" onclick="saveHero()">💾 保存欢迎区</button></div>
    </div>

    <!-- 技能 -->
    <div class="glass" style="margin-bottom:20px;">
      <div class="section-title">🎯 技能管理</div>
      <div id="skillsEditor"></div>
      <button class="btn" onclick="addSkill()">+ 添加技能</button>
      <div style="margin-top:12px;"><button class="btn btn-primary" onclick="saveSkills()">💾 保存技能</button></div>
    </div>

    <!-- 项目 -->
    <div class="glass" style="margin-bottom:20px;">
      <div class="section-title">📁 项目管理</div>
      <div id="projectsEditor"></div>
      <button class="btn" onclick="addProject()">+ 添加项目</button>
      <div style="margin-top:12px;"><button class="btn btn-primary" onclick="saveProjects()">💾 保存项目</button></div>
    </div>

    <!-- 生活碎片 -->
    <div class="glass" style="margin-bottom:20px;">
      <div class="section-title">🌈 生活碎片</div>
      <div id="lifeEditor"></div>
      <button class="btn" onclick="addLife()">+ 添加</button>
      <div style="margin-top:12px;"><button class="btn btn-primary" onclick="saveLife()">💾 保存</button></div>
    </div>

    <!-- 社交链接 -->
    <div class="glass" style="margin-bottom:20px;">
      <div class="section-title">🔗 社交链接</div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">GitHub</label><input class="form-input" id="s_github"></div>
        <div class="form-group"><label class="form-label">邮箱 (mailto:)</label><input class="form-input" id="s_email"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">微信（链接或 #）</label><input class="form-input" id="s_wechat"></div>
        <div class="form-group"><label class="form-label">Instagram</label><input class="form-input" id="s_instagram"></div>
      </div>
      <div class="form-group"><label class="form-label">小红书</label><input class="form-input" id="s_xiaohongshu"></div>
      <div style="margin-top:8px;"><button class="btn btn-primary" onclick="saveSocial()">💾 保存社交链接</button></div>
    </div>

    <!-- 主题 -->
    <div class="glass" style="margin-bottom:20px;">
      <div class="section-title">🎨 主题色</div>
      <div id="themeEditor"></div>
      <div style="margin-top:8px;"><button class="btn btn-primary" onclick="saveTheme()">💾 保存主题</button></div>
    </div>

    <!-- 危险区 -->
    <div class="glass" style="margin-bottom:40px;border-color:rgba(255,59,48,0.2);">
      <div class="section-title" style="color:#ff6b6b;">⚠️ 危险操作</div>
      <button class="btn btn-danger" onclick="resetData()">🔄 重置所有数据为默认</button>
    </div>
  </div>
</div>

<div id="toastContainer"></div>

<script>
/* ====== 全局状态 ====== */
let TOKEN = localStorage.getItem('gh_token') || '';
let USER = localStorage.getItem('gh_user') || '';
let REPO = localStorage.getItem('gh_repo') || '';
let DATA_PATH = localStorage.getItem('gh_path') || 'data.json';
let DATA = null;

/* ====== Toast ====== */
function toast(msg, type='success') {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast toast-' + type;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 3000);
}

/* ====== GitHub API 封装 ====== */
async function ghRequest(path, options={}) {
  const headers = { 'Authorization': 'Bearer ' + TOKEN, 'Accept': 'application/vnd.github+json', ...options.headers };
  const res = await fetch('https://api.github.com' + path, { ...options, headers });
  if (!res.ok) throw new Error(`GitHub API ${res.status}: ${await res.text()}`);
  return res.json();
}

// 读取文件内容（返回 {content: base64, sha: 文件标识}）
async function ghReadFile() {
  const [owner, repo] = REPO.split('/');
  const data = await ghRequest(`/repos/${owner}/${repo}/contents/${DATA_PATH}`);
  return { content: atob(data.content.replace(/\n/g,'')), sha: data.sha, data };
}

// 写入文件（更新 data.json）
async function ghWriteFile(content, sha) {
  const [owner, repo] = REPO.split('/');
  const body = {
    message: '📝 更新个人主页数据',
    content: btoa(unescape(encodeURIComponent(content))), // utf-8 → base64
    sha: sha,
  };
  return ghRequest(`/repos/${owner}/${repo}/contents/${DATA_PATH}`, {
    method: 'PUT', headers: {'Content-Type':'application/json'},
    body: JSON.stringify(body),
  });
}

/* ====== 登录 ====== */
async function doLogin() {
  USER = document.getElementById('f_user').value.trim();
  TOKEN = document.getElementById('f_token').value.trim();
  REPO = document.getElementById('f_repo').value.trim();
  DATA_PATH = document.getElementById('f_path').value.trim() || 'data.json';
  if (!USER || !TOKEN || !REPO) { toast('请填写完整信息', 'error'); return; }
  try {
    // 验证 token
    await ghRequest(`/user`);
    // 验证能读到文件
    await ghReadFile();
    // 保存凭据
    localStorage.setItem('gh_token', TOKEN);
    localStorage.setItem('gh_user', USER);
    localStorage.setItem('gh_repo', REPO);
    localStorage.setItem('gh_path', DATA_PATH);
    // 拉取数据
    await loadData();
    // 切换界面
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('adminPage').style.display = 'block';
    renderAll();
    toast('登录成功 ✅');
  } catch(e) {
    console.error(e);
    toast('登录失败：' + e.message, 'error');
  }
}

function doLogout() {
  localStorage.removeItem('gh_token');
  TOKEN = '';
  document.getElementById('loginPage').style.display = 'block';
  document.getElementById('adminPage').style.display = 'none';
}

/* ====== 数据读写 ====== */
async function loadData() {
  const { content } = await ghReadFile();
  DATA = JSON.parse(content);
}

async function saveData() {
  const { sha } = await ghReadFile();
  await ghWriteFile(JSON.stringify(DATA, null, 2), sha);
  toast('✅ 已保存到 GitHub，约30秒后主页生效');
}

/* ====== 渲染 ====== */
function renderAll() {
  if (!DATA) return;
  const p = DATA.profile || {};
  document.getElementById('p_name').value = p.name || '';
  document.getElementById('p_title').value = p.title || '';
  document.getElementById('p_city').value = p.city || '';
  document.getElementById('p_job').value = p.job || '';
  document.getElementById('p_hobby').value = p.hobby || '';
  document.getElementById('p_avatarText').value = p.avatarText || '';
  document.getElementById('p_avatarUrl').value = p.avatarUrl || '';
  document.getElementById('p_bio').value = (p.bio || '').replace(/<br>/g, '\n');

  document.getElementById('h_greeting').value = p.heroGreeting || '';
  document.getElementById('h_name').value = p.heroName || '';
  document.getElementById('h_desc').value = p.heroDesc || '';

  renderSkills();
  renderProjects();
  renderLife();
  renderSocial();
  renderTheme();
}

function renderSkills() {
  const c = document.getElementById('skillsEditor');
  c.innerHTML = '';
  (DATA.skills || []).forEach((s, i) => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:10px;align-items:center;margin-bottom:10px;';
    row.innerHTML = `
      <input class="form-input" style="flex:1" placeholder="技能名" value="${s.name}" onchange="DATA.skills[${i}].name=this.value">
      <input class="form-input" style="width:80px" type="number" min="0" max="100" value="${s.pct}" onchange="DATA.skills[${i}].pct=+this.value">
      <span style="font-size:12px;color:var(--soft);width:24px;">%</span>
      <button class="btn btn-danger" onclick="DATA.skills.splice(${i},1);renderSkills()">✕</button>`;
    c.appendChild(row);
  });
}

function renderProjects() {
  const c = document.getElementById('projectsEditor');
  c.innerHTML = '';
  (DATA.projects || []).forEach((p, i) => {
    const row = document.createElement('div');
    row.style.cssText = 'border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;';
    row.innerHTML = `
      <div style="display:flex;gap:10px;margin-bottom:8px;">
        <input class="form-input" style="flex:1" placeholder="标题" value="${p.title}" onchange="DATA.projects[${i}].title=this.value">
        <input class="form-input" style="width:100px" placeholder="标签" value="${p.tag||''}" onchange="DATA.projects[${i}].tag=this.value">
        <button class="btn btn-danger" onclick="DATA.projects.splice(${i},1);renderProjects()">✕</button>
      </div>
      <input class="form-input" placeholder="描述" value="${p.desc}" onchange="DATA.projects[${i}].desc=this.value">`;
    c.appendChild(row);
  });
}

function renderLife() {
  const c = document.getElementById('lifeEditor');
  c.innerHTML = '';
  (DATA.life || []).forEach((l, i) => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:10px;align-items:center;margin-bottom:8px;';
    row.innerHTML = `
      <input class="form-input" style="flex:1" placeholder="名称" value="${l.name}" onchange="DATA.life[${i}].name=this.value">
      <select class="form-input" style="width:120px" onchange="DATA.life[${i}].icon=this.value">
        <option value="camera" ${l.icon==='camera'?'selected':''}>📷 摄影</option>
        <option value="music" ${l.icon==='music'?'selected':''}>🎵 音乐</option>
        <option value="book" ${l.icon==='book'?'selected':''}>📚 阅读</option>
        <option value="heart" ${l.icon==='heart'?'selected':''}>💖 冥想</option>
      </select>
      <button class="btn btn-danger" onclick="DATA.life.splice(${i},1);renderLife()">✕</button>`;
    c.appendChild(row);
  });
}

function renderSocial() {
  const s = DATA.social || {};
  document.getElementById('s_github').value = s.github || '';
  document.getElementById('s_email').value = s.email || '';
  document.getElementById('s_wechat').value = s.wechat || '';
  document.getElementById('s_instagram').value = s.instagram || '';
  document.getElementById('s_xiaohongshu').value = s.xiaohongshu || '';
}

function renderTheme() {
  const themes = ['neon','redice','pop','darkp','rose','green'];
  const names = ['霓虹粉青','深红冰蓝','荧光粉绿','紫黑极简','玫瑰红','苹果绿青'];
  const c = document.getElementById('themeEditor');
  c.innerHTML = '<select class="form-input" id="themeSelect">' +
    themes.map((t,i) => `<option value="${t}" ${(DATA.theme||'neon')===t?'selected':''}>${names[i]}</option>`).join('') +
    '</select>';
}

/* ====== 添加/保存 ====== */
function addSkill() { DATA.skills.push({name:'新技能',pct:50}); renderSkills(); }
function addProject() { DATA.projects.push({title:'新项目',desc:'描述',tag:'标签',icon:'chart'}); renderProjects(); }
function addLife() { DATA.life.push({name:'新爱好',icon:'heart'}); renderLife(); }

function saveProfile() {
  DATA.profile.name = document.getElementById('p_name').value;
  DATA.profile.title = document.getElementById('p_title').value;
  DATA.profile.city = document.getElementById('p_city').value;
  DATA.profile.job = document.getElementById('p_job').value;
  DATA.profile.hobby = document.getElementById('p_hobby').value;
  DATA.profile.avatarText = document.getElementById('p_avatarText').value;
  DATA.profile.avatarUrl = document.getElementById('p_avatarUrl').value;
  DATA.profile.bio = document.getElementById('p_bio').value.replace(/\n/g,'<br>');
  saveData();
}

function saveHero() {
  DATA.profile.heroGreeting = document.getElementById('h_greeting').value;
  DATA.profile.heroName = document.getElementById('h_name').value;
  DATA.profile.heroDesc = document.getElementById('h_desc').value;
  saveData();
}

function saveSkills() { saveData(); }
function saveProjects() { saveData(); }
function saveLife() { saveData(); }

function saveSocial() {
  DATA.social = {
    github: document.getElementById('s_github').value,
    email: document.getElementById('s_email').value,
    wechat: document.getElementById('s_wechat').value,
    instagram: document.getElementById('s_instagram').value,
    xiaohongshu: document.getElementById('s_xiaohongshu').value,
  };
  saveData();
}

function saveTheme() {
  DATA.theme = document.getElementById('themeSelect').value;
  saveData();
}

async function resetData() {
  if (!confirm('确定要重置所有数据为默认吗？')) return;
  DATA = {
    profile:{name:'你的名字',title:'// 你的方向',bio:'简单介绍自己<br>生活化的描述',avatarText:'YN',avatarUrl:'',city:'厦门',job:'设计师',hobby:'摄影 · 旅行',heroGreeting:'— 你好，欢迎 —',heroName:'你的名字',heroDesc:'写一段关于自己的话'},
    skills:[{name:'Photoshop',pct:88},{name:'Figma',pct:85},{name:'摄影',pct:80},{name:'视频剪辑',pct:70}],
    projects:[{title:'项目一',desc:'描述',tag:'标签',icon:'chart'},{title:'项目二',desc:'描述',tag:'标签',icon:'camera'}],
    life:[{name:'摄影',icon:'camera'},{name:'音乐',icon:'music'},{name:'阅读',icon:'book'},{name:'冥想',icon:'heart'}],
    social:{github:'https://github.com',email:'mailto:hello@example.com',wechat:'#',instagram:'https://instagram.com',xiaohongshu:'https://xiaohongshu.com'},
    theme:'neon'
  };
  await saveData();
  renderAll();
}

/* ====== 启动 ====== */
if (TOKEN && USER && REPO) {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('adminPage').style.display = 'block';
  // 自动登录
  ghReadFile().then(({content}) => {
    DATA = JSON.parse(content);
    renderAll();
    toast('已自动登录');
  }).catch(() => { doLogout(); });
}
</script>

</body>
</html>
